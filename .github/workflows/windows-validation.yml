name: Windows build and tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Compile with Windows Framework csc and run tests
        shell: powershell
        run: ./tests/Run-Windows.ps1
      - name: Keep diagnostic screenshots and generated scripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-validation
          path: |
            build/*.png
            build/generated-tests/*.ps1
          if-no-files-found: ignore
